[project]
name = "mini-code-agent"
version = "0.2.0"
description = "A minimal coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45",
    "django>=5.2,<6.0",
    "flagembedding>=1.4.0",
    "huggingface-hub>=0.36,<1",
    "jieba>=0.42.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "transformers>=4.44.2,<5",
]

[project.optional-dependencies]
cuda-eval = [
    "fastembed-gpu==0.8.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime-gpu==1.26.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch==2.6.0+cu124 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
flashrank = [
    "flashrank>=0.2.10",
]

[dependency-groups]
cpu = [
    "fastembed==0.8.0",
]
dev = [
    "coverage",
    "mypy",
    "pre-commit",
    "ruff",
    "tqdm>=4.67.1",
    "types-tqdm",
    "types-PyYAML",
]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [
    [
        { group = "cpu" },
        { extra = "cuda-eval" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", extra = "cuda-eval" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["config/core"]
always_true = ["__package__"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = [
    "config/core",
    "config/chat",
]
omit = [
    "config/chat/tests/*",
    "config/chat/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
