[project]
name = "mini-code-agent"
version = "0.2.0"
description = "A minimal coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45",
    "django>=5.2,<6.0",
    "fastembed>=0.8.0",
    "jieba>=0.42.1",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
]

[dependency-groups]
dev = [
    "coverage",
    "mypy",
    "pre-commit",
    "ruff",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
files = ["config/core"]
always_true = ["__package__"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = [
    "config/core",
    "config/chat",
]
omit = [
    "config/chat/tests/*",
    "config/chat/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
